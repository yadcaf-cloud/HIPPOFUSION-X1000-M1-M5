name: HIPPOFUSION X1000 M1-M5

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: hippofusion-hourly
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verifier et executer
        env:
          TZ: Europe/Paris
        run: |
          python -m py_compile main.py
          python main.py --diagnostic
          python main.py --figer

      - name: Publier les fichiers JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/courses.json data/figes.json data/audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: actualiser les donnees HIPPOFUSION'
            git push
          fi

      - name: Conserver un rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hippofusion-${{ github.run_id }}
          path: data/*.json
          if-no-files-found: warn
