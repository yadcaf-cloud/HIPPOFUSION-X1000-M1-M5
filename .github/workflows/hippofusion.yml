
name: HIPPOFUSION X1000 M1-M5

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: hippofusion-hourly
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Paris
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances facultatives
        shell: bash
        run: |
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Verifier le programme
        run: python -m py_compile main.py

      - name: Diagnostic HIPPOFUSION
        run: python main.py --diagnostic

      - name: Analyser et figer les courses disponibles
        run: python main.py --figer --input data/courses.json --output data

      - name: Verifier les rapports JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/audit.json')
          assert p.is_file(), 'audit.json absent'
          audit = json.loads(p.read_text(encoding='utf-8'))
          assert 'statut_collecte' in audit and isinstance(audit['courses'], list)
          for p in Path('data').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          print('Rapports JSON valides ; statut :', audit['statut_collecte'])
          PY

      - name: Publier les rapports
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/
          if git diff --cached --quiet; then
            echo 'Aucune modification a publier'
          else
            git commit -m 'chore: actualiser rapports HIPPOFUSION'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Archiver les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hippofusion-${{ github.run_id }}
          path: data/**/*.json
          if-no-files-found: warn
          retention-days: 30
