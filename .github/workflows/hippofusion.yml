name: HIPPOFUSION X1000 M1-M5

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

concurrency:
  group: hippofusion-hourly
  cancel-in-progress: false

jobs:
  analyse:
    name: Analyse hippique automatique
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Europe/Paris
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Verifier le programme
        run: |
          if [ ! -f main.py ]; then
            echo "ERREUR : main.py absent"
            exit 1
          fi
          python -m py_compile main.py

      - name: Executer HIPPOFUSION
        run: |
          python main.py

      - name: Archiver les resultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hippofusion-resultats-${{ github.run_id }}
          path: |
            data/
            results/
            rapports/
            logs/
          if-no-files-found: warn
          retention-days: 30
